[workspace]
members = ["crates/core", "crates/server", "crates/client"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracker-core = { path = "crates/core" }

[profile.release]
lto = "thin"
# Not `true`: that also removes the section trunk needs to optimize the WASM.
strip = "debuginfo"
