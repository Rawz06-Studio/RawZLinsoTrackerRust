[package]
name = "tracker-client"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = "0.37"
ewebsock = { version = "0.8", features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"
resvg = { version = "0.49", default-features = false }
serde_json.workspace = true
tracker-core.workspace = true
wuff = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["include-exclude"] }
# ewebsock's `tls` feature leaves rustls without a crypto backend.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "HtmlCanvasElement", "KeyboardEvent", "Location", "Window"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tracker-server = { path = "../server" }
