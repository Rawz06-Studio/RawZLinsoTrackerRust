name: Release

on:
  push:
    branches:
      - main

# Versions are computed from the previous one, so releases must not overlap.
concurrency:
  group: release

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Bump, tag and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(bash .github/scripts/bump-version.sh)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "🔖 release $tag [skip ci]"
          git tag "$tag"
          git push --atomic origin HEAD:main "$tag"
          gh release create "$tag" --verify-tag --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: binaries (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ".AppImage"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ".dmg"
    env:
      TRACKER_SERVER_URL: ${{ vars.TRACKER_SERVER_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev desktop-file-utils

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tracker-client

      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          binary="target/${{ matrix.target }}/release/tracker-client"
          asset="RawZLinsoTracker-${{ matrix.name }}${{ matrix.ext }}"
          case "$RUNNER_OS" in
            macOS) bash .github/scripts/package-macos.sh "$binary" "${TAG#v}" "$asset" ;;
            Linux) bash .github/scripts/package-linux.sh "$binary" "$asset" ;;
            Windows) cp "$binary.exe" "$asset" ;;
          esac
          gh release upload "$TAG" "$asset" --clobber

  preprod:
    # The shared workflow checks out the branch, which now has the new version.
    needs: version
    uses: RawZ06-Studio/.github/.github/workflows/docker-build-push.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: tracker-online-rust
      dokploy_app_id: DTjMDDBQDjlgTsCgvL47F
    secrets: inherit
