name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    env:
      TRACKER_SERVER_URL: ${{ vars.TRACKER_SERVER_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tracker-client -p tracker-server

      - name: Package
        shell: bash
        run: |
          package="RawZLinsoTracker-${{ matrix.name }}"
          mkdir "$package"
          cp target/${{ matrix.target }}/release/tracker-client* target/${{ matrix.target }}/release/tracker-server* "$package"/
          rm -f "$package"/*.d "$package"/*.pdb
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$package.zip" "$package"
          else
            tar -czf "$package.tar.gz" "$package"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: RawZLinsoTracker-${{ matrix.name }}
          path: |
            RawZLinsoTracker-*.zip
            RawZLinsoTracker-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
